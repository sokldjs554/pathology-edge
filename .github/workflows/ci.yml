name: CPU checks
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-lock.txt
      - run: CC=gcc CXX=g++ python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest -q
      - run: node --check dist/app.js
      - run: python scripts/validate_demo.py
