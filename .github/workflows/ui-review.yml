name: UI browser review
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Browser target'
        type: choice
        options: [checkout, production]
        default: checkout
  push:
    paths: ['web-tests/**', 'dist/**', '.github/workflows/ui-review.yml']
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-tests/package-lock.json
      - run: npm ci
        working-directory: web-tests
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: web-tests
      - run: node --test web-tests/viewer-math.test.cjs
      - run: npx playwright test
        env:
          UI_BROWSER: ${{ matrix.browser }}
          UI_BASE_URL: ${{ inputs.target == 'production' && 'https://pathology-edge-lab.ykh13571.chatgpt.site' || '' }}
        working-directory: web-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-browser-evidence-${{ matrix.browser }}
          path: |
            web-tests/captures/
            web-tests/report.json
            web-tests/test-results/
