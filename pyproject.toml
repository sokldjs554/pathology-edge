[build-system]
requires = ["setuptools>=68", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "pathology-edge"
version = "0.1.0"
description = "Reproducible research workbench for pathology patch boundaries"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "Pillow>=10", "opencv-python-headless>=4.8", "torch>=2.2", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pybind11>=2.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["learner: reserved for user implementation; opt in with --run-learner"]

